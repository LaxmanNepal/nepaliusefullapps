name: Record approved project submission
on:
  issues:
    types: [labeled]
permissions:
  contents: write
  issues: write
  pull-requests: read
concurrency:
  group: approve-submission
  cancel-in-progress: false
jobs:
  approve:
    if: github.event.label.name == 'approved' && contains(toJSON(github.event.issue.labels), 'project-submission')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and record approved public repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: python scripts/approve_submission.py
      - name: Commit approved project data
        run: |
          if git diff --quiet -- data/approved-submissions.json; then
            echo "No approved project changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/approved-submissions.json
          git commit -m "chore: record approved project submission"
          git push
