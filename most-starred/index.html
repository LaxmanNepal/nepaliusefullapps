<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Most Starred — Nepali Useful Apps</title><meta name="description" content="The most-starred projects discovered from Nepali creators."><style>:root{--bg:#f6f7fb;--card:#fff;--text:#111827;--muted:#667085;--line:#e5e7eb;--brand:#2563eb;--dark:#111827;--gold:#b45309}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text)}a{color:inherit;text-decoration:none}.top{position:sticky;top:0;z-index:5;background:#fffffff2;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}nav{max-width:1240px;height:68px;margin:auto;padding:0 20px;display:flex;align-items:center;gap:20px}.logo{font-weight:900;font-size:19px;margin-right:auto}.logo span{color:var(--brand)}.links{display:flex;gap:18px;font-size:14px;color:#475467}.wrap{max-width:1240px;margin:auto;padding:45px 20px 70px}.hero{display:flex;justify-content:space-between;gap:25px;margin-bottom:25px}.eyebrow{font-size:12px;font-weight:900;color:var(--brand);letter-spacing:.08em;text-transform:uppercase}.hero h1{font-size:clamp(34px,5vw,58px);margin:8px 0}.hero p{max-width:720px;color:var(--muted);line-height:1.6}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;min-width:150px;height:max-content}.stat b{font-size:28px;display:block}.stat small{color:var(--muted)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:#fff}.toolbar input{flex:1;min-width:240px}.chips{display:flex;gap:8px;overflow:auto}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;white-space:nowrap}.chip.active{background:var(--dark);color:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:0 10px 30px #1018280a}.preview{height:190px;background:#eef2f7;position:relative}.preview iframe{width:100%;height:100%;border:0}.fallback{height:100%;display:grid;place-items:center;color:var(--muted)}.rank,.type{position:absolute;top:12px;background:#111827;color:#fff;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:800;z-index:2}.rank{left:12px}.type{right:12px;background:#ffffffe8;color:#111827}.body{padding:16px}.title{display:flex;justify-content:space-between;gap:10px}.title h2{margin:0;font-size:18px}.stars{color:var(--gold);font-weight:900}.desc{color:var(--muted);font-size:13px;line-height:1.5;min-height:40px}.creator{display:flex;gap:9px;align-items:center;border-top:1px solid var(--line);padding-top:12px}.avatar{width:32px;height:32px;border-radius:50%}.creator small{display:block;color:var(--muted)}.actions{display:flex;gap:8px;margin-top:13px}.btn{border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:12px;font-weight:800}.btn.primary{background:var(--dark);color:#fff}.empty{padding:50px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:15px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.hero{flex-direction:column}}@media(max-width:600px){.links{display:none}.grid{grid-template-columns:1fr}.wrap{padding:30px 14px}.hero h1{font-size:40px}}
</style></head><body><header class="top"><nav><a class="logo" href="../">Nepali<span>UsefulApps</span></a><div class="links"><a href="../">Discover</a><a href="../top-creators/">Top Creators</a><a href="../categories/">Categories</a></div></nav></header><main class="wrap"><section class="hero"><div><div class="eyebrow">GitHub community ranking</div><h1>🔥 Most Starred</h1><p>Explore the highest-starred projects discovered from Nepali creators. Every project is loaded from the full generated directory, with live demos and GitHub links.</p></div><div class="stat"><b id="total">—</b><small>projects indexed</small></div></section><div class="toolbar"><input id="search" placeholder="Search projects, creators, topics…"><select id="stars"><option value="0">Any stars</option><option value="1">1+ stars</option><option value="5">5+ stars</option><option value="10">10+ stars</option><option value="50">50+ stars</option><option value="100">100+ stars</option><option value="500">500+ stars</option><option value="1000">1,000+ stars</option></select><select id="limit"><option value="100">Top 100</option><option value="50">Top 50</option><option value="25">Top 25</option><option value="10">Top 10</option></select></div><div class="chips" id="chips"></div><section style="margin-top:25px"><div id="grid" class="grid"></div></section></main><script>
let all=[],type='All';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));const getType=p=>p.type||'Open Source';
function card(p,i){const live=p.demo||p.homepage,c={login:p.creatorLogin,name:p.creatorName,avatar:p.creatorAvatar};return `<article class="card"><div class="preview">${live?`<iframe loading="lazy" src="${esc(live)}" title="${esc(p.title||p.name)}" sandbox="allow-forms allow-modals allow-popups allow-presentation allow-scripts allow-same-origin"></iframe>`:`<div class="fallback">Open-source project</div>`}<span class="rank">#${i+1}</span><span class="type">${esc(getType(p))}</span></div><div class="body"><div class="title"><h2>${esc(p.title||p.name)}</h2><span class="stars">★ ${(p.stars||0).toLocaleString()}</span></div><p class="desc">${esc(p.description||'Useful project by a Nepali creator.')}</p><a class="creator" href="../#/creator/${encodeURIComponent(c.login||'')}"><img class="avatar" src="${esc(c.avatar||`https://github.com/${c.login||''}.png?size=96`)}"><span><b>${esc(c.name||c.login||'Creator')}</b><small>@${esc(c.login||'')}</small></span></a><div class="actions"><a class="btn primary" href="../#/project/${encodeURIComponent(c.login||'')}/${encodeURIComponent(p.name||'')}">Details</a>${live?`<a class="btn" href="${esc(live)}" target="_blank" rel="noopener noreferrer">Open app ↗</a>`:''}<a class="btn" href="${esc(p.url||'#')}" target="_blank" rel="noopener noreferrer">GitHub ↗</a></div></div></article>`}
function render(){const q=$('search').value.trim().toLowerCase(),min=Number($('stars').value),limit=Number($('limit').value);let list=all.filter(p=>(type==='All'||getType(p)===type)&&(p.stars||0)>=min);if(q)list=list.filter(p=>`${p.title||''} ${p.name||''} ${p.description||''} ${p.creatorName||''} ${p.creatorLogin||''} ${(p.topics||[]).join(' ')}`.toLowerCase().includes(q));list.sort((a,b)=>(b.stars||0)-(a.stars||0));$('grid').innerHTML=(list.slice(0,limit)).map(card).join('')||'<div class="empty" style="grid-column:1/-1">No projects match these filters.</div>'}
function chips(){const types=['All',...new Set(all.map(getType))].sort((a,b)=>a==='All'?-1:b==='All'?1:a.localeCompare(b));$('chips').innerHTML=types.map(t=>`<button class="chip ${t===type?'active':''}" data-t="${esc(t)}">${esc(t)}</button>`).join('');document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{type=b.dataset.t;chips();render()})}
async function load(){try{const r=await fetch('../data/directory.json?ts='+Date.now());if(!r.ok)throw Error('data');const d=await r.json();all=Array.isArray(d.projects)?d.projects:[];$('total').textContent=(d.projectCount||all.length).toLocaleString();chips();render()}catch(e){$('grid').innerHTML='<div class="empty" style="grid-column:1/-1">Directory data could not be loaded.</div>'}}$('search').oninput=render;$('stars').onchange=render;$('limit').onchange=render;load();</script></body></html>
