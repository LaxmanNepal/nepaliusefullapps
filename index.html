<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nepali Useful Apps — Nepali Creators & Projects</title>
<meta name="description" content="Discover useful web apps, websites and open-source projects built by Nepali creators.">
<meta name="theme-color" content="#111827">
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#111827;--muted:#667085;--line:#e5e7eb;--brand:#2563eb;--brand2:#7c3aed;--soft:#eef4ff;--dark:#111827;--shadow:0 12px 32px #1018280d}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}a{color:inherit;text-decoration:none}button,input,select{font:inherit}.top{position:sticky;top:0;z-index:20;background:#fffffff2;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.nav{max-width:1240px;margin:auto;height:68px;display:flex;align-items:center;gap:22px;padding:0 20px}.logo{font-weight:900;font-size:19px;white-space:nowrap}.logo span{color:var(--brand)}.navlinks{display:flex;gap:18px;font-size:14px;color:#475467}.navlinks a:hover{color:var(--brand)}.navsearch{margin-left:auto;width:min(310px,35vw);position:relative}.navsearch input{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 13px;background:#fff;outline:none}.hero{max-width:1240px;margin:0 auto;padding:62px 20px 30px}.heroGrid{display:grid;grid-template-columns:1.5fr .8fr;gap:28px;align-items:center}.eyebrow{color:var(--brand);font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.08em}.hero h1{font-size:clamp(36px,5vw,64px);line-height:1.02;margin:10px 0 17px;letter-spacing:-.045em}.hero h1 span{background:linear-gradient(90deg,var(--brand),var(--brand2));-webkit-background-clip:text;color:transparent}.hero p{color:var(--muted);font-size:17px;line-height:1.65;max-width:680px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}.stat b{display:block;font-size:27px}.stat small{color:var(--muted)}main{max-width:1240px;margin:auto;padding:10px 20px 70px}.toolbar{display:flex;gap:10px;align-items:center;margin:15px 0 22px;flex-wrap:wrap}.toolbar input,.toolbar select{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 12px;outline:none}.toolbar input{min-width:250px;flex:1}.chips{display:flex;gap:8px;overflow:auto}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;cursor:pointer;white-space:nowrap}.chip.active{background:var(--dark);color:#fff;border-color:var(--dark)}.sectionTitle{display:flex;justify-content:space-between;align-items:end;margin:34px 0 15px}.sectionTitle h2{margin:0;font-size:25px}.sectionTitle p{margin:4px 0 0;color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);transition:.2s}.card:hover{transform:translateY(-3px);box-shadow:0 18px 40px #10182814}.preview{height:185px;background:#eef2f7;position:relative;overflow:hidden}.preview iframe{width:100%;height:100%;border:0;background:#fff}.preview .fallback{height:100%;display:grid;place-items:center;color:#667085;font-weight:700}.badge{position:absolute;left:12px;top:12px;background:#ffffffe8;border:1px solid #ffffff;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:800;z-index:2}.cardBody{padding:16px}.titleRow{display:flex;justify-content:space-between;gap:12px}.card h3{margin:0;font-size:18px}.stars{font-size:12px;color:#b45309;white-space:nowrap}.desc{font-size:13px;color:var(--muted);line-height:1.55;min-height:41px;margin:9px 0}.creator{display:flex;align-items:center;gap:9px;border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.avatar{width:31px;height:31px;border-radius:50%;background:#ddd;object-fit:cover}.creator b{font-size:13px}.creator small{display:block;color:var(--muted)}.actions{display:flex;gap:8px;margin-top:13px}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;font-size:12px;font-weight:800;cursor:pointer}.btn.primary{background:var(--dark);color:#fff;border-color:var(--dark)}.btn:hover{opacity:.88}.creatorGrid{grid-template-columns:repeat(4,1fr)}.creatorCard{padding:18px}.creatorTop{display:flex;gap:12px;align-items:center}.creatorTop img{width:52px;height:52px;border-radius:50%}.creatorCard h3{margin:0 0 4px;font-size:16px}.creatorCard p{margin:0;color:var(--muted);font-size:12px}.count{margin-top:16px;color:var(--muted);font-size:12px}.empty{padding:50px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:16px}.profile{max-width:900px;margin:35px auto}.profileHead{background:#fff;border:1px solid var(--line);border-radius:22px;padding:25px;display:flex;gap:20px;align-items:center}.profileHead img{width:88px;height:88px;border-radius:50%}.profileHead h1{margin:0 0 5px}.profileHead p{margin:0;color:var(--muted);line-height:1.6}.profileLinks{margin-left:auto;display:flex;gap:8px}.modal{position:fixed;inset:0;background:#111827b8;z-index:100;display:none;padding:25px}.modal.show{display:flex}.modalBox{background:#fff;border-radius:18px;width:min(1100px,100%);height:min(760px,100%);margin:auto;overflow:hidden;display:flex;flex-direction:column}.modalBar{height:55px;padding:0 15px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.modal iframe{flex:1;border:0}.close{border:0;background:#f2f4f7;border-radius:9px;padding:8px 12px;cursor:pointer}.hidden{display:none!important}footer{border-top:1px solid var(--line);padding:30px 20px;text-align:center;color:var(--muted);font-size:13px}@media(max-width:900px){.heroGrid{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.creatorGrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.navlinks{display:none}.navsearch{width:160px}.hero{padding-top:35px}.grid,.creatorGrid{grid-template-columns:1fr}.profileHead{align-items:flex-start;flex-direction:column}.profileLinks{margin-left:0}.stats{margin-top:10px}.preview{height:200px}}
</style>
</head>
<body>
<header class="top"><nav class="nav"><a class="logo" href="#/">Nepali<span>UsefulApps</span></a><div class="navlinks"><a href="#/">Discover</a><a href="#/creators">Creators</a><a href="#/projects">Projects</a></div><div class="navsearch"><input id="globalSearch" placeholder="Search creators & projects…"></div></nav></header>
<div id="app"></div>
<div class="modal" id="previewModal"><div class="modalBox"><div class="modalBar"><b id="modalTitle">Live preview</b><button class="close" onclick="closePreview()">Close</button></div><iframe id="modalFrame" sandbox="allow-forms allow-modals allow-popups allow-presentation allow-scripts allow-same-origin"></iframe></div></div>
<footer>Built as a community directory for useful projects made by Nepali creators. Project links and repository data come from public sources.</footer>
<script>
const seed=[
 {login:'prabhashj07',name:'Prabhash Joshi',bio:'Developer building useful Nepali tools and libraries.',repos:[{name:'nepalikit',title:'NepaliKit',description:'A toolkit for working with Nepali language and data.',url:'https://github.com/prabhashj07/nepalikit',demo:'https://prabhashj07.github.io/nepalikit/',type:'Web App',stars:0}]},
 {login:'ajaysinghnp',name:'Ajay Singh',bio:'Nepali developer and open-source contributor.',repos:[{name:'Nepali-Calendar-Web-Component',title:'Nepali Calendar Web Component',description:'A reusable web component for the Nepali calendar.',url:'https://github.com/ajaysinghnp/Nepali-Calendar-Web-Component',demo:'https://ajaysinghnp.github.io/Nepali-Calendar-Web-Component/',type:'Web App',stars:0}]},
 {login:'bimalstha23',name:'Bimal Stha',bio:'Developer focused on practical Nepal-focused APIs.',repos:[{name:'Nepal-Address-API',title:'Nepal Address API',description:'API project for structured Nepal address data.',url:'https://github.com/bimalstha23/Nepal-Address-API',demo:'',type:'API',stars:0}]},
 {login:'prabin194',name:'Prabin',bio:'Open-source developer building Nepali input tools.',repos:[{name:'nepali-keyboard',title:'Nepali Keyboard',description:'A Nepali keyboard project for the web.',url:'https://github.com/prabin194/nepali-keyboard',demo:'https://prabin194.github.io/nepali-keyboard/',type:'Web App',stars:0}]},
 {login:'sahilkhatiwada',name:'Sahil Khatiwada',bio:'Developer working on Nepali date and utility software.',repos:[{name:'nepali-date-converter',title:'Nepali Date Converter',description:'Convert between Nepali and Gregorian dates.',url:'https://github.com/sahilkhatiwada/nepali-date-converter',demo:'',type:'Library',stars:0}]},
 {login:'paraslamsong',name:'Paras Lamsong',bio:'Developer creating validation utilities for Nepal.',repos:[{name:'nepali-phone-number-validator',title:'Nepali Phone Number Validator',description:'Validate Nepali phone numbers programmatically.',url:'https://github.com/paraslamsong/nepali-phone-number-validator',demo:'',type:'Library',stars:0}]},
 {login:'iam8uman',name:'iam8uman',bio:'Builder of Nepal-focused market and data projects.',repos:[{name:'market-pulse-nepal',title:'Market Pulse Nepal',description:'A Nepal market-data project and dashboard.',url:'https://github.com/iam8uman/market-pulse-nepal',demo:'',type:'Dashboard',stars:0}]},
 {login:'yankeexe',name:'Yankeexe',bio:'Developer and maintainer of Nepali developer resources.',repos:[{name:'nepali-devblogs',title:'Nepali DevBlogs',description:'A collection of Nepali developer blogs and resources.',url:'https://github.com/yankeexe/nepali-devblogs',demo:'',type:'Community',stars:0}]}
];
let creators=JSON.parse(localStorage.getItem('nu-creators')||'null')||seed;
let projects=()=>creators.flatMap(c=>c.repos.map(r=>({...r,creator:c})));let q='';let category='All';
function esc(s=''){return s.replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function avatar(c){return `https://github.com/${encodeURIComponent(c.login)}.png?size=120`}
function projectCard(p){let live=p.demo||p.homepage;return `<article class="card"><div class="preview">${live?`<span class="badge">${esc(p.type||'Project')}</span><iframe loading="lazy" src="${esc(live)}" title="${esc(p.title)}" sandbox="allow-forms allow-modals allow-popups allow-presentation allow-scripts allow-same-origin"></iframe>`:`<div class="fallback"><span>Open-source project</span></div>`}</div><div class="cardBody"><div class="titleRow"><h3>${esc(p.title||p.name)}</h3><span class="stars">★ ${p.stars||0}</span></div><p class="desc">${esc(p.description||'Useful project by a Nepali creator.')}</p><a class="creator" href="#/creator/${encodeURIComponent(p.creator.login)}"><img class="avatar" src="${avatar(p.creator)}"><span><b>${esc(p.creator.name)}</b><small>@${esc(p.creator.login)}</small></span></a><div class="actions">${live?`<button class="btn primary" onclick="openPreview('${esc(live)}','${esc(p.title||p.name)}')">Open web view</button>`:''}<a class="btn" target="_blank" rel="noopener" href="${esc(p.url)}">Repo</a></div></div></article>`}
function home(){let list=projects().filter(p=>(category==='All'||p.type===category)&&`${p.title} ${p.description} ${p.creator.name}`.toLowerCase().includes(q));return `<section class="hero"><div class="heroGrid"><div><div class="eyebrow">Nepali creator ecosystem</div><h1>Find useful <span>projects built by Nepali creators.</span></h1><p>A visual directory for websites, web apps, tools and open-source projects. Explore the project first, then open the creator profile to see everything they have built.</p></div><div class="stats"><div class="stat"><b>${creators.length}</b><small>Creators indexed</small></div><div class="stat"><b>${projects().length}</b><small>Projects showcased</small></div><div class="stat"><b>Live</b><small>Web-view previews</small></div></div></div></section><main><div class="toolbar"><input id="projectSearch" value="${esc(q)}" placeholder="Search projects, creators, tools…"><div class="chips">${['All',...new Set(projects().map(p=>p.type))].map(x=>`<button class="chip ${x===category?'active':''}" onclick="setCat('${esc(x)}')">${esc(x)}</button>`).join('')}</div></div><div class="sectionTitle"><div><h2>Trending & useful</h2><p>Projects currently highlighted in the directory.</p></div><a class="btn" href="#/projects">View all</a></div><div class="grid">${list.length?list.map(projectCard).join(''):`<div class="empty" style="grid-column:1/-1">No projects match your search.</div>`}</div><div class="sectionTitle"><div><h2>Creators to explore</h2><p>Open a profile to see their complete project portfolio.</p></div><a class="btn" href="#/creators">All creators</a></div><div class="grid creatorGrid">${creators.slice(0,8).map(creatorCard).join('')}</div></main>`}
function creatorCard(c){return `<a class="card creatorCard" href="#/creator/${encodeURIComponent(c.login)}"><div class="creatorTop"><img src="${avatar(c)}"><div><h3>${esc(c.name)}</h3><p>@${esc(c.login)}</p></div></div><div class="count">${c.repos.length} project${c.repos.length===1?'':'s'} · View portfolio →</div></a>`}
function creatorsPage(){return `<main><div class="sectionTitle"><div><h2>Nepali Creators</h2><p>People currently indexed in the directory.</p></div></div><div class="toolbar"><input id="creatorSearch" placeholder="Search creator name or username…"></div><div id="creatorList" class="grid creatorGrid">${creators.map(creatorCard).join('')}</div></main>`}
function projectsPage(){return `<main><div class="sectionTitle"><div><h2>All Projects</h2><p>Browse every project currently showcased.</p></div></div><div class="grid">${projects().map(projectCard).join('')}</div></main>`}
function profile(login){let c=creators.find(x=>x.login===login);if(!c)return `<main><div class="empty">Creator not found.</div></main>`;return `<main class="profile"><div class="profileHead"><img src="${avatar(c)}"><div><h1>${esc(c.name)}</h1><p>@${esc(c.login)} · ${esc(c.bio||'Nepali creator')}<br>${c.repos.length} showcased project${c.repos.length===1?'':'s'}</p></div><div class="profileLinks"><a class="btn" target="_blank" href="https://github.com/${encodeURIComponent(c.login)}">GitHub</a></div></div><div class="sectionTitle"><div><h2>Projects by ${esc(c.name)}</h2><p>Demo, repository and project description.</p></div></div><div class="grid">${c.repos.map(r=>projectCard({...r,creator:c})).join('')}</div></main>`}
function render(){let path=location.hash.slice(1)||'/';let html=path==='/creators'?creatorsPage():path==='/projects'?projectsPage():path.startsWith('/creator/')?profile(decodeURIComponent(path.split('/')[2])):home();document.getElementById('app').innerHTML=html;let ps=document.getElementById('projectSearch');if(ps)ps.oninput=e=>{q=e.target.value.toLowerCase();render()};let cs=document.getElementById('creatorSearch');if(cs)cs.oninput=e=>{let v=e.target.value.toLowerCase();document.getElementById('creatorList').innerHTML=creators.filter(c=>`${c.name} ${c.login}`.toLowerCase().includes(v)).map(creatorCard).join('')};}
function setCat(x){category=x;render()}function openPreview(url,title){document.getElementById('modalTitle').textContent=title;document.getElementById('modalFrame').src=url;document.getElementById('previewModal').classList.add('show')}function closePreview(){document.getElementById('previewModal').classList.remove('show');document.getElementById('modalFrame').src=''}
document.getElementById('globalSearch').oninput=e=>{q=e.target.value.toLowerCase();location.hash='/'};window.addEventListener('hashchange',render);render();
// Load the prebuilt daily index instead of making every visitor call GitHub's API.
(async()=>{
  try {
    const response=await fetch('data/directory.json',{cache:'no-store'});
    if(!response.ok) throw new Error('Directory data is not available yet');
    const data=await response.json();
    if(Array.isArray(data.creators)&&data.creators.length){
      creators=data.creators.map(c=>({...c,repos:(c.repos||[]).map(r=>({...r}))}));
      localStorage.setItem('nu-creators',JSON.stringify(creators));
      window.directoryMeta={generatedAt:data.generatedAt,discoveryNote:data.discoveryNote,projectCount:data.projectCount};
      render();
    }
  } catch(error) { console.info('Using starter directory until the first scheduled refresh completes.',error); }
})();
</script></body></html>
